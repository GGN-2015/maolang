[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "maolang"
version = "0.1.0"
description = "A small extensible language whose library commands are Python programs"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "GGN_2015" },
]
keywords = ["interpreter", "language", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
dependencies = []

[project.scripts]
maolang = "maolang.cli:main"

[tool.setuptools.packages.find]
include = ["maolang*"]

[tool.setuptools.package-data]
maolang = ["lib/*.py", "py.typed"]
